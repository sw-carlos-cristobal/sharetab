name: Docker Fresh Install

# Boots the production image the way a new install does (empty data volume,
# bundled PostgreSQL, docker/entrypoint.sh), then restarts it the way every
# existing install does on upgrade. The Test workflow runs the app with
# `npm run start` against its own database, so it never exercises the
# entrypoint or the manual SQL migrations.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-fresh-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: sharetab:ci
          # Reuse the layers the main-branch image build caches.
          cache-from: type=gha,scope=main-image

      - name: Start on an empty database
        run: |
          source .github/scripts/fresh-install-helpers.sh
          secret=$(openssl rand -base64 32)
          docker run -d --name sharetab -p 3000:3000 \
            -e NEXTAUTH_SECRET="$secret" -e AUTH_SECRET="$secret" \
            sharetab:ci
          wait_healthy "first start"

          # The tables exist, not just a reachable database (psql fails if
          # either is missing).
          db -c 'SELECT count(*) FROM "User"' -c 'SELECT count(*) FROM "GuestSplit"'

      - name: Emails are unique ignoring case
        run: |
          source .github/scripts/fresh-install-helpers.sh
          add_user ci-1 'CI@Example.com'
          if add_user ci-2 'ci@example.com'; then
            echo "::error::A case variant of an existing email was accepted."
            exit 1
          fi
          add_user ci-3 'other@example.com'
          db -c "DELETE FROM \"User\" WHERE id LIKE 'ci-%'"

      - name: Restart, and prisma db push keeps the email index
        run: |
          source .github/scripts/fresh-install-helpers.sh
          # The after-push SQL would recreate a dropped index before we look,
          # so compare the index's identity instead of just its existence.
          before=$(db -c "SELECT '\"User_email_lower_key\"'::regclass::oid")
          docker restart sharetab
          wait_healthy "restart"
          after=$(db -c "SELECT '\"User_email_lower_key\"'::regclass::oid")
          if [ "$before" != "$after" ]; then
            echo "::error::prisma db push dropped User_email_lower_key (oid $before -> $after)."
            exit 1
          fi

      - name: Existing case-variant duplicates don't block startup
        run: |
          source .github/scripts/fresh-install-helpers.sh
          # An install from before the index, with case-variant duplicates.
          db -c 'DROP INDEX "User_email_lower_key"'
          add_user dup-1 'Dup@Example.com'
          add_user dup-2 'dup@example.com'
          docker restart sharetab
          wait_healthy "restart with duplicates"
          if ! docker logs sharetab 2>&1 | grep -q "more than one account uses each of these addresses in different letter cases: dup@example.com"; then
            echo "::error::No warning about the duplicate emails in the startup log."
            exit 1
          fi
          if [ "$(has_email_index)" != "f" ]; then
            echo "::error::The email index exists although duplicates do."
            exit 1
          fi

          # Once the duplicate is gone, the next start creates the index.
          db -c "DELETE FROM \"User\" WHERE id = 'dup-2'"
          docker restart sharetab
          wait_healthy "restart after removing the duplicate"
          if [ "$(has_email_index)" != "t" ]; then
            echo "::error::The email index wasn't created after the duplicate was removed."
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs sharetab || true
