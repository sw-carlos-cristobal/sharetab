name: Docker Fresh Install

# Builds the production image and runs scripts/docker-smoke.sh against it:
# a fresh install on an empty data volume, restarts the way every existing
# install does on upgrade, and the Meridian provider starting inside the image
# and running through the app. The Test workflow runs the app with
# `npm run start` against its own database, so it never exercises the
# entrypoint, the pre-push SQL migrations, or the packages the Dockerfile
# adds. Run it locally with `npm run test:docker`.

# Pull requests (and manual runs): on main, docker.yml runs the same script
# before it publishes the image.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-fresh-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: sharetab:ci
          # Reuse the layers the main-branch image build caches.
          cache-from: type=gha,scope=main-image

      - name: Smoke test the image
        run: scripts/docker-smoke.sh --image sharetab:ci
