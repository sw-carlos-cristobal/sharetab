# Dependency + Actions update automation. Until now Dependabot only opened
# security-update PRs here (the "npm_and_yarn group" bumps); this config adds
# routine version updates, grouped so they arrive as one PR per ecosystem per
# week instead of a cascade of conflicting singles.
#
# Ecosystems:
#   npm            root package.json + package-lock.json
#   github-actions .github/workflows/*.yml
#   docker         docker/Dockerfile base image
#
# CI runs on GitHub-hosted runners (public repo), so bot PRs need no runner
# variable. auto-release.yml runs on every push to main and cuts a build tag,
# so a merged dependency bump gets one like any other merge; promote-stable.yml
# is manual (workflow_dispatch) and is not triggered by these merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # All npm deps (runtime and dev alike): one PR per week for minor/patch
      # bumps; majors still arrive individually.
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Majors that can't land yet. Remove an entry once its condition clears.
    ignore:
      # ESLint 10 removed context.getFilename(), which eslint-plugin-react
      # (pulled in by eslint-config-next) still calls, so `npm run lint`
      # crashes. Lift when eslint-plugin-react supports ESLint 10 (#176).
      - dependency-name: eslint
        versions: ['>=10']
      # typescript-eslint supports TypeScript <6.1.0 and crashes on load under
      # TypeScript 7. 6.0.x can still be proposed. Lift when typescript-eslint
      # supports TypeScript 7 (#175).
      - dependency-name: typescript
        versions: ['>=7']
      # Types track the Node major that Docker and CI run (node:22-alpine,
      # node-version: 22). Raise this together with the Node upgrade (#171,
      # #177).
      - dependency-name: '@types/node'
        versions: ['>=23']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      ci-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
